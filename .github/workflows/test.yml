name: checks

# BOS is a no-code, no-Python pack: skills/commands are Markdown, the studios are
# Node. CI therefore does two things only — make sure no real credential ever
# lands in the repo, and make sure the deleted Python runtime never creeps back.
# No secrets are referenced anywhere in this file, on purpose. The secret scan
# uses TruffleHog (free, no license) in filesystem mode.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (no key may enter the repo)
        run: |
          set -euo pipefail
          # Free, license-free secret scan. Filesystem mode is deterministic on
          # both push and pull_request (no BASE/HEAD range to trip over).
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog filesystem . --results=verified,unknown --fail --no-update

      - name: No-Python guard (the pack must stay pure-MCP)
        run: |
          set -e
          # The Python data-fetch runtime was removed deliberately. Fail if any of
          # it returns, or if a skill/command starts shelling out to python again.
          if git ls-files '*.py' | grep -q .; then
            echo "::error::A .py file is tracked. BOS is Python-free — remove it."
            git ls-files '*.py'
            exit 1
          fi
          if grep -RInE 'python (tools/|~/\.claude|skills/)|bos-run\.py|fetch\.py|trustpager_api' \
               --include='*.md' skills commands agents knowledge templates README.md INSTALL.md; then
            echo "::error::Found a reference to the removed Python runtime above."
            exit 1
          fi
          echo "OK — no Python runtime references."

      - name: Skill frontmatter sanity
        run: |
          set -e
          # Every skill needs a SKILL.md with name + description frontmatter.
          fail=0
          for d in skills/*/; do
            f="$d/SKILL.md"
            if [ ! -f "$f" ]; then echo "::error::$d has no SKILL.md"; fail=1; continue; fi
            head -n 1 "$f" | grep -q '^---$' || { echo "::error::$f missing frontmatter"; fail=1; }
            grep -q '^name:' "$f"        || { echo "::error::$f missing name:"; fail=1; }
            grep -q '^description:' "$f" || { echo "::error::$f missing description:"; fail=1; }
          done
          [ "$fail" -eq 0 ] && echo "OK — every skill has valid frontmatter."
          exit $fail
